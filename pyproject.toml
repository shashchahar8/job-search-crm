[project]
name = "job-search-crm"
version = "0.1.0"
description = "Local job-search CRM with a manually prompted SEEK collector."
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4",
  "fastapi",
  "jinja2",
  "playwright",
  "pydantic",
  "pydantic-settings",
  "python-multipart",
  "sqlalchemy",
  "tzdata",
  "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
